# Раз на 3 дні звертається до API, щоб безкоштовний проєкт Supabase не ставився на паузу.
# Додайте в GitHub → Settings → Secrets: SUPABASE_URL і SUPABASE_ANON_KEY
name: keepalive
on:
  schedule: [{ cron: "0 6 */3 * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/teams?select=id&limit=1" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
